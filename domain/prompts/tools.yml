# =============================================================================
# Tool descriptions (runtime source of truth).
#
# Grouped by component (tool file), then by tool function name. Each entry has
# a `description` tag passed to the `@tool(description=...)` decorator. These
# override the neutral English defaults shipped by Semente
# (semente/configs/prompts/defaults/tools.yml).
#
# The framework's generic tools come first; Pasto10 domain tools get their own
# component (named after the file under domain/tools/). Domain tools also carry
# a `results` mapping: the instruction texts each tool returns to the model,
# rendered with str.format placeholders (e.g. {radius}).
# =============================================================================

tts_tools:
  generate_speech:
    description: |
      Generates spoken audio (text-to-speech) from a provided text.

      WHEN TO USE:
      - Call this tool ONLY when the user explicitly requests an audio or voice response.
      - Call this tool if the current session or the system preference requires audio responses.

      Args:
          text (str): The full text content to be spoken.

      Returns:
          ToolResult: Result object containing the generated speech.

onboarding_tools:
  accept_terms_and_conditions:
    description: |
      Records the user's formal acceptance of the Pasto10 Terms and Conditions in the database.

      Use when the user clearly accepts the terms (e.g. "I accept", "yes", "I agree").

version_tools:
  consult_update_notes:
    description: |
      Reads and returns the release notes (patch notes) of the Pasto10 system.
      Use this tool when the user asks about the current version, news or updates.

feedback_tools:
  record_frustration_feedback:
    description: |
      Records a user correction when the assistant provides an incorrect answer.
      Use this function strictly when the following sequence of events occurs:
      1. The user asks a question.
      2. The assistant answers.
      3. The user complains about the answer.
      4. The assistant asks the user to explain what the correct answer would be.
      5. The user provides the answer.

      Args:
          reason_frustration (str): Why the user was frustrated.
          desired_answer (str): The answer the user expected.
  record_analisys_feedback:
    description: |
      Records a suggestion for a new feature or data analysis.
      Use when the user requests an analysis the assistant does not yet have tools to generate.

      Args:
          original_question (str): The user's original request.
          desired_analysis (str): The analysis the user would like to see.

persona_tools:
  update_persona_name:
    description: |
      Organically updates the user's name in the session persona (profile).

      Use this tool only when the user informs or confirms their name naturally
      during the conversation.

      Args:
          name (str): The user's first name (e.g. "John", "Maria").
  update_persona_role:
    description: |
      Organically updates the user's professional role in the session persona.

      Use this tool when you clearly identify whether the user is a rancher/producer
      or a technical advisor/agronomist.

      Args:
          role (str): Exactly "Produtor" for a rancher/producer, or "Técnico" for a
              technical advisor/agronomist (these are the only accepted values).
  update_persona_region:
    description: |
      Organically updates the user's region/location in the session persona.

      Use this tool when the user mentions the city, state, province, country or
      region where they operate.

      Args:
          regionality (str): The user's city, region or country (e.g. "Mato Grosso, Brazil", "Queensland, Australia").
  create_persona_preference:
    description: |
      Adds a new preference, interest or behavior discovered about the user.

      Use this tool subtly whenever you notice a taste, routine or preference of the user.
      Avoid duplicating existing keys. If the key already exists, use 'update_persona_preference'.

      Args:
          key (str): A short lowercase keyword identifying the category (e.g. "livestock", "grazing_system", "contact_time").
          description (str): Details about the user's taste or behavior in that category.
  update_persona_preference:
    description: |
      Updates an existing preference or behavior in the user's persona.

      Use this tool when the user changes their mind or brings new information
      about a point that was previously mapped.

      Args:
          key (str): The exact keyword of the preference to update (e.g. "livestock").
          description (str): The new description that replaces the previous one.
  remove_persona_preference:
    description: |
      Removes a specific preference from the user's profile when it is no longer valid.

      Args:
          key (str): The keyword of the preference to remove.

property_tools:
  start_buffer_registration_by_coordinate:
    description: |
      Starts the registration of a new circular area (buffer) around a point,
      given its coordinate and a radius in meters.

      Use this tool when the user gives a coordinate (latitude/longitude) of a
      place they want to monitor and agrees to register the area around it.
      If the user explicitly asks to register an area and gives the
      coordinate, call this tool right away, without asking for agreement first.
      The area is generated locally; no external registry is queried.

      Coordinates must be in decimal degrees. Convert a coordinate given in
      degrees, minutes and seconds (DMS) before calling: decimal = |D| + M/60 + S/3600,
      then make it negative for S/W (or when D is already negative). Minutes may
      also come as decimals (e.g. 15°30.5'S). Examples: 15°30'0"S 47°30'0"W -> -15.5, -47.5;
      -15°30'0" -> -15.5.

      Args:
          latitude (float): Latitude of the center point in decimal degrees (between -85 and 85).
          longitude (float): Longitude of the center point in decimal degrees (between -180 and 180).
          radius (int): Buffer radius in meters (50 to 1000). Default: 200.

      Returns:
          ToolResult: Confirmation image of the area and instructions for the next step.
    results:
      invalid_radius: |
        The radius of {radius} m is not accepted. Apologize to the user and explain that the radius must be between {min_radius} and {max_radius} meters, then ask for a radius within that range.
      invalid_coordinates: |
        The coordinate ({latitude}, {longitude}) is not valid. Apologize to the user and explain that the latitude must be between -{max_latitude} and {max_latitude} degrees and the longitude between -180 and 180 degrees (decimal degrees), then ask for the coordinate again.
      confirm_buffer_area: |
        The area image was sent to the user. Ask the user whether the following area is the correct one:
        > {area_details}
        Mention that the radius is {radius} m and that they can choose another radius between {min_radius} and {max_radius} m (default: {default_radius} m).
      error: |
        An unexpected error occurred. Apologize to the user and suggest trying again in a moment.
  confirm_registration:
    description: |
      Confirms the pending area shown in the image.

      Use this tool when the user confirms the area is correct (e.g. "yes", "that's it").

      If the user also gives the desired name IN THE SAME message as the
      confirmation (e.g. "Yes, call it North Paddock"), pass that name in the
      `name` parameter — the registration is then completed immediately,
      without waiting for another turn.

      Args:
          name (str, optional): Name for the area, only when the user already gave one.
    results:
      no_pending_area: |
        There is no area pending confirmation. Ask the user for the coordinate of the area they want to register first.
      confirmed_prompt_name: |
        The area was confirmed:
        > {area_details}
        Ask the user what name they would like to give this area to complete the registration.
      error: |
        An unexpected error occurred. Apologize to the user and suggest trying again in a moment.
  complete_registration:
    description: |
      Completes the registration of the confirmed area with the name chosen by the user.

      Use this tool when the user tells you the name of the area.

      Args:
          name (str): The name chosen by the user for the area.
    results:
      no_pending_area: |
        There is no area pending registration. Ask the user for the coordinate of the area they want to register first.
      registration_complete: |
        Area registered successfully.
        Name: {name}
        Details: {area_details}

        Tell the user, in one short message, that the area was registered with this name.
      error: |
        An unexpected error occurred. Apologize to the user and suggest trying again in a moment.
  cancel_registration:
    description: |
      Cancels the pending registration.

      Use this tool if the user says the area shown in the image is NOT the
      correct one, wants a different location or radius, or wants to cancel
      the registration.
    results:
      cancelled: |
        The registration was cancelled and nothing was saved. If the user asked for a different radius or location, repeat the new value back and ask them to confirm so the new area can be generated; otherwise, let them know briefly that they can send a new coordinate (and radius) whenever they want to register an area.
      error: |
        An unexpected error occurred. Apologize to the user and suggest trying again in a moment.

pasture_tools:
  generate_pasture_map:
    description: |
      Generates a map of the pasture inside a registered area, drawn over satellite imagery.

      Use this tool when the user asks to see the pasture, a pasture map or where the grasslands are
      in one of their registered areas. If the user names an area, pass it in `area_name`; if not, the
      latest registered area is used. If the user asks for a specific year, pass it in `year`.
      The default year is 2022, the latest Global Pasture Watch map; pass a later year only when the user asks
      for it, which returns an experimental on-the-fly estimate.
      The map distinguishes cultivated grassland from natural/semi-natural grassland.

      Args:
          area_name (str, optional): Name of a registered area. When omitted, the most recently registered area is used.
          year (int, optional): Reference year. When omitted, 2022 (the latest Global Pasture Watch year) is used. Years after 2022 give an experimental estimate.

      Returns:
          ToolResult: The map image and the pasture figures of the area.
    results:
      success: |
        Pasture analysis of "{area_name}" for {year} (source: {source}):
        - Pasture (cultivated + natural/semi-natural): {pasture_ha} ha ({pasture_percent}% of the {area_ha} ha analyzed)
        - Cultivated grassland: {cultivated_ha} ha
        - Natural/semi-natural grassland: {natural_ha} ha
        The map image was sent to the user. Describe it briefly: state the year and the data source,
        and give the pasture area in hectares. Remember that this is satellite-derived and does not replace field verification.
        If the source is the Pasto10 classification, this is an experimental estimate, not an official map and not a measurement: state that clearly, present the figures only as an order of magnitude, say that it can diverge a lot from one year to the next and from the official map (in a validation against official maps, about 90% of the pixels agreed on average, but some areas deviated by several times the official pasture area), do not compare it with earlier years as a trend, and recommend 2022 (the latest Global Pasture Watch year) as the reliable reference.
      no_registered_area: |
        The user has no registered area yet. Explain that an area is needed first and ask for the coordinate (latitude/longitude in decimal degrees) and, optionally, the radius of the area to register.
      area_not_found: |
        No registered area matches the name "{area_name}". Apologize, tell the user the name was not found among their registered areas (listed in the <registrations> block) and ask which one they mean.
      year_unavailable: |
        There is no pasture data for the requested year. Tell the user that data is available from {first_year} to {latest_year} (years after 2022 are estimates produced by Pasto10, not official maps) and ask which year they would like.
      earth_engine_unavailable: |
        The satellite data service is temporarily unavailable. Apologize, say you cannot produce this result right now and do NOT present any figures or maps; suggest trying again later.
      error: |
        An unexpected error occurred. Apologize to the user and suggest trying again in a moment.
  get_pasture_area:
    description: |
      Measures how many hectares of pasture exist inside a registered area.

      Use this tool when the user asks how much pasture, grassland or pastureland an area has
      (total, cultivated or natural). If the user names an area, pass it in `area_name`; if not, the
      latest registered area is used. If the user asks for a specific year, pass it in `year`.
      The default year is 2022, the latest Global Pasture Watch map; pass a later year only when the user asks
      for it, which returns an experimental on-the-fly estimate.

      Args:
          area_name (str, optional): Name of a registered area. When omitted, the most recently registered area is used.
          year (int, optional): Reference year. When omitted, 2022 (the latest Global Pasture Watch year) is used. Years after 2022 give an experimental estimate.

      Returns:
          ToolResult: Pasture area in hectares (total, cultivated and natural/semi-natural) for the year.
    results:
      success: |
        Pasture analysis of "{area_name}" for {year} (source: {source}):
        - Pasture (cultivated + natural/semi-natural): {pasture_ha} ha ({pasture_percent}% of the {area_ha} ha analyzed)
        - Cultivated grassland: {cultivated_ha} ha
        - Natural/semi-natural grassland: {natural_ha} ha
        Report the figures to the user in plain language, always stating the year and the data source.
        Remember that this is satellite-derived and does not replace field verification.
        If the source is the Pasto10 classification, this is an experimental estimate, not an official map and not a measurement: state that clearly, present the figures only as an order of magnitude, say that it can diverge a lot from one year to the next and from the official map (in a validation against official maps, about 90% of the pixels agreed on average, but some areas deviated by several times the official pasture area), do not compare it with earlier years as a trend, and recommend 2022 (the latest Global Pasture Watch year) as the reliable reference.
      no_registered_area: |
        The user has no registered area yet. Explain that an area is needed first and ask for the coordinate (latitude/longitude in decimal degrees) and, optionally, the radius of the area to register.
      area_not_found: |
        No registered area matches the name "{area_name}". Apologize, tell the user the name was not found among their registered areas (listed in the <registrations> block) and ask which one they mean.
      year_unavailable: |
        There is no pasture data for the requested year. Tell the user that data is available from {first_year} to {latest_year} (years after 2022 are estimates produced by Pasto10, not official maps) and ask which year they would like.
      earth_engine_unavailable: |
        The satellite data service is temporarily unavailable. Apologize, say you cannot produce this result right now and do NOT present any figures or maps; suggest trying again later.
      error: |
        An unexpected error occurred. Apologize to the user and suggest trying again in a moment.

biomass_tools:
  generate_biomass_map:
    description: |
      Generates a map of the dry-matter production of the pasture inside a registered area, drawn over satellite imagery.

      Use this tool when the user asks to see the biomass, productivity or dry matter of one of their registered
      areas. If the user names an area, pass it in `area_name`; if not, the latest registered area is used.
      The default is the latest annual Global Pasture Watch year (2025). Pass `year` for another annual year
      (2000-2025). Pass `month` (1-12), optionally with `year`, only when the user asks for recent monthly data from
      Time2Graze, which covers only recent months and part of the world. Never pick a month or a year on your own.

      The values are accumulated dry-matter production of the period in t DM/ha, NOT standing biomass and NOT available forage.

      Args:
          area_name (str, optional): Name of a registered area. When omitted, the most recently registered area is used.
          year (int, optional): Reference year (2000-2025 annual; later years use recent Time2Graze data when available).
          month (int, optional): Month (1-12) of recent Time2Graze data.

      Returns:
          ToolResult: The map image and the mean and total dry-matter production of the pasture of the area.
    results:
      success: |
        Dry-matter production of the pasture of "{area_name}", period {period} ({start} to {end}, {days} days), source: {source}.
        - Mean: {mean_t_ha} t DM/ha
        - Total: {total_t} t DM over {pasture_ha} ha of productive pasture ({pasture_percent}% of the {area_ha} ha analyzed)
        The map image was sent to the user. State the period and source, explain that these are accumulated dry-matter production estimates of the period (not standing biomass or available forage, and not a stocking capacity), and that they are approximate (a general conversion, calibrated for cultivated tropical pastures; elsewhere only an order of magnitude). Never compare annual with monthly figures, nor Global Pasture Watch with Time2Graze figures. Satellite estimates do not replace field verification.
      note_mask_year: |
        The pasture mask is the Global Pasture Watch grassland map of {mask_year}, the latest available, older than {year}: mention it briefly.
      note_time2graze: |
        This period comes from Time2Graze: it covers only {days} days ({start} to {end}) from {n_images} image(s), recent data with partial coverage, so say that the figures are short-period and indicative.
      note_partial_year: |
        The user asked for {year}, but the data cover only part of that year, from {start} to {end} ({days} days): make clear that the figures are NOT for the whole year, give these dates and days, and never present them as an annual value.
      no_registered_area: |
        The user has no registered area yet. Explain that an area is needed first and ask for the coordinate (latitude/longitude in decimal degrees) and, optionally, the radius of the area to register.
      area_not_found: |
        No registered area matches the name "{area_name}". Apologize, tell the user the name was not found among their registered areas (listed in the <registrations> block) and ask which one they mean.
      year_unavailable: |
        There is no dry-matter data for the requested year. Tell the user that annual data is available from {first_year} to {latest_year} and ask which year they would like. Do not present any figures.
      month_unavailable: |
        There is no Time2Graze data for the requested month and area. Time2Graze covers only recent months and part of the world: its data currently spans {t2g_start} to {t2g_end}. Tell the user this, suggest the annual Global Pasture Watch data instead, and do NOT present any figures or substitute another source.
      no_pasture: |
        The area "{area_name}" has no productive pasture according to the Global Pasture Watch grassland map, so there is no dry-matter production to report. Tell the user and do NOT present any figures.
      earth_engine_unavailable: |
        The satellite data service is temporarily unavailable. Apologize, say you cannot produce this result right now and do NOT present any figures or maps; suggest trying again later.
      error: |
        An unexpected error occurred. Apologize to the user and suggest trying again in a moment.
  get_biomass_total:
    description: |
      Measures the mean (t DM/ha) and total (t DM) dry-matter production of the pasture inside a registered area.

      Use this tool when the user asks how much biomass, dry matter or pasture production an area has. If the
      user names an area, pass it in `area_name`; if not, the latest registered area is used.
      The default is the latest annual Global Pasture Watch year (2025). Pass `year` for another annual year
      (2000-2025). Pass `month` (1-12), optionally with `year`, only when the user asks for recent monthly data from
      Time2Graze, which covers only recent months and part of the world. Never pick a month or a year on your own.

      The values are accumulated dry-matter production of the period in t DM/ha, NOT standing biomass and NOT available forage.

      Args:
          area_name (str, optional): Name of a registered area. When omitted, the most recently registered area is used.
          year (int, optional): Reference year (2000-2025 annual; later years use recent Time2Graze data when available).
          month (int, optional): Month (1-12) of recent Time2Graze data.

      Returns:
          ToolResult: Mean and total dry-matter production of the pasture of the area for the period.
    results:
      success: |
        Dry-matter production of the pasture of "{area_name}", period {period} ({start} to {end}, {days} days), source: {source}.
        - Mean: {mean_t_ha} t DM/ha
        - Total: {total_t} t DM over {pasture_ha} ha of productive pasture ({pasture_percent}% of the {area_ha} ha analyzed)
        Report the figures in plain language, always stating the period and the source. Explain that these are accumulated dry-matter production estimates of the period (not standing biomass or available forage, and not a stocking capacity), and that they are approximate (a general conversion, calibrated for cultivated tropical pastures; elsewhere only an order of magnitude). Never compare annual with monthly figures, nor Global Pasture Watch with Time2Graze figures. Satellite estimates do not replace field verification.
      note_mask_year: |
        The pasture mask is the Global Pasture Watch grassland map of {mask_year}, the latest available, older than {year}: mention it briefly.
      note_time2graze: |
        This period comes from Time2Graze: it covers only {days} days ({start} to {end}) from {n_images} image(s), recent data with partial coverage, so say that the figures are short-period and indicative.
      note_partial_year: |
        The user asked for {year}, but the data cover only part of that year, from {start} to {end} ({days} days): make clear that the figures are NOT for the whole year, give these dates and days, and never present them as an annual value.
      no_registered_area: |
        The user has no registered area yet. Explain that an area is needed first and ask for the coordinate (latitude/longitude in decimal degrees) and, optionally, the radius of the area to register.
      area_not_found: |
        No registered area matches the name "{area_name}". Apologize, tell the user the name was not found among their registered areas (listed in the <registrations> block) and ask which one they mean.
      year_unavailable: |
        There is no dry-matter data for the requested year. Tell the user that annual data is available from {first_year} to {latest_year} and ask which year they would like. Do not present any figures.
      month_unavailable: |
        There is no Time2Graze data for the requested month and area. Time2Graze covers only recent months and part of the world: its data currently spans {t2g_start} to {t2g_end}. Tell the user this, suggest the annual Global Pasture Watch data instead, and do NOT present any figures or substitute another source.
      no_pasture: |
        The area "{area_name}" has no productive pasture according to the Global Pasture Watch grassland map, so there is no dry-matter production to report. Tell the user and do NOT present any figures.
      earth_engine_unavailable: |
        The satellite data service is temporarily unavailable. Apologize, say you cannot produce this result right now and do NOT present any figures or maps; suggest trying again later.
      error: |
        An unexpected error occurred. Apologize to the user and suggest trying again in a moment.
