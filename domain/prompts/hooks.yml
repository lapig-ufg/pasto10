# =============================================================================
# Hook texts (runtime source of truth).
#
# User-facing/system messages returned or injected by the Semente validation
# hooks. These override the neutral English defaults shipped by Semente
# (semente/configs/prompts/defaults/hooks.yml).
# =============================================================================

tool_hooks:
  # validate_selected_property_hook: blocking message when no area is selected.
  no_property_selected: |
    It was not possible to complete the analysis because there is no selected area.
    Apologize to the user. Ask the user to provide the location of the area they want to analyze.
  # validate_rate_limit_hook: media already delivered in this session.
  media_already_delivered: |
    The requested media has already been generated with these exact parameters and delivered in this session.
  # validate_rate_limit_hook: empty media returned by the map service.
  media_empty: |
    Error: The map service returned empty media. Try again.
  # validate_rate_limit_hook: external integration failure prefix.
  media_integration_error: |
    External integration error: Failed to run {function_name}. Detail: {error}
