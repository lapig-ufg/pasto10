services:
  streamlit_app:
    build: .
    command: uv run streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - .:/app
      - /app/.venv
      - ./tmp:/app/tmp
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
      - APP_ENV=development
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env