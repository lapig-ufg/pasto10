name: pasto10
language: en
domain_module: domain
engine: agno
prompts_dir: domain/prompts
# Sources of candidate property polygons, in priority order (see README, "Adapting Pasto10 to your country").
property_sources: [demo_registry, osm]
channels: [streamlit]
features:
  tts: true
  interaction-assessment: true
  summarization: true
  guardrails: true
  terms-acceptance:
    enable: true
    file: domain/terms.md
models:
  primary: { provider: google, id: gemini-3.5-flash-lite }
  fallback: { provider: ollama, id: gemma4:31b-cloud }
