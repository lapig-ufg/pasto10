[project]
name = "pasto10"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "earthengine-api==1.7.4",
    # Agno's Ollama backend (the manifest fallback) imports the OpenAI client;
    # Semente 0.4 dropped the litellm dependency that used to bring it in.
    "openai>=2.54.0,<3",
    "pillow>=12.3.0",
    "reportlab>=5.0.1",
    "requests>=2.34.2",
    "semente-agents",
    "shapely>=2.2.0",
    "streamlit>=1.52.2,<1.53",
]

[tool.uv.sources]
semente-agents = { git = "https://github.com/lapig-ufg/semente.git" }

[dependency-groups]
dev = [
    "pypdf>=6.21.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = ["e2e: real Earth Engine and network calls; needs GEE_* variables (run with -m e2e)"]
