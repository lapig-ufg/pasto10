[project]
name = "pasto10"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "earthengine-api==1.7.4",
    "pillow>=12.3.0",
    "requests>=2.34.2",
    "semente-agents",
]

[tool.uv.sources]
semente-agents = { git = "https://github.com/lapig-ufg/semente.git" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = ["e2e: real Earth Engine and network calls; needs GEE_* variables (run with -m e2e)"]
